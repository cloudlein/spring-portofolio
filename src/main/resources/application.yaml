spring:
  application:
    name: portofolio
  profiles:
    active: dev # Default profile for local development

  # Jackson Settings
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null

  # Shared Redis Caching Configuration
  cache:
    type: redis
    redis:
      use-key-prefix: true
      key-prefix: "portofolio:cache:"

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# Springdoc / OpenAPI Common Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
