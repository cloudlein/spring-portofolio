<!--
/* Hallmark · component: login-form · genre: modern-minimal · theme: cobalt
 * states: default · hover · focus · active · disabled · loading · error · success
 * contrast: pass (4.5:1+)
 */
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio Portal</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-bg: #090a0f;
            --color-surface: #12131a;
            --color-border: #222533;
            --color-border-hover: #33384c;
            --color-border-focus: #6366f1;
            --color-text-main: #f8fafc;
            --color-text-muted: #94a3b8;
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
            --color-primary-focus: rgba(99, 102, 241, 0.25);
            
            --color-error-bg: rgba(248, 113, 113, 0.08);
            --color-error-border: rgba(248, 113, 113, 0.25);
            --color-error-text: #f87171;
            
            --color-success-bg: rgba(74, 222, 128, 0.08);
            --color-success-border: rgba(74, 222, 128, 0.25);
            --color-success-text: #4ade80;
            
            --font-family: 'Inter', sans-serif;
            --transition-speed: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--color-text-muted);
            font-size: 14px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            display: none;
            line-height: 1.4;
        }

        .alert-error {
            background-color: var(--color-error-bg);
            border: 1px solid var(--color-error-border);
            color: var(--color-error-text);
        }

        .alert-success {
            background-color: var(--color-success-bg);
            border: 1px solid var(--color-success-border);
            color: var(--color-success-text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--color-text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(9, 10, 15, 0.6);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text-main);
            font-size: 15px;
            outline: none;
            transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
        }

        /* Input states: Hover, Focus */
        .input-wrapper input:hover {
            border-color: var(--color-border-hover);
        }

        .input-wrapper input:focus {
            border-color: var(--color-border-focus);
            box-shadow: 0 0 0 3px var(--color-primary-focus);
        }

        /* Button states: Default, Hover, Focus, Active, Disabled */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--color-primary);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color var(--transition-speed), transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            outline: none;
        }

        .btn-submit:hover {
            background-color: var(--color-primary-hover);
        }

        .btn-submit:focus-visible {
            box-shadow: 0 0 0 3px var(--color-primary-focus);
            border: 1px solid var(--color-border-focus);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .btn-submit:disabled {
            background-color: var(--color-border);
            color: var(--color-text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner for Loading State */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            color: var(--color-text-muted);
            font-size: 13px;
        }

        .footer-note a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-speed);
        }

        .footer-note a:hover {
            color: var(--color-primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card" id="loginCard">
        <div class="header">
            <h1>Welcome Back</h1>
            <p>Enter your credentials to access the portal</p>
        </div>

        <div class="alert alert-error" id="errorAlert">Invalid email or password.</div>
        <div class="alert alert-success" id="successAlert">Authenticated successfully! Redirecting...</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="name@domain.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Sign In</span>
            </button>
        </form>

        <div class="footer-note">
            Return to the <a href="/">Main Page</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const card = document.getElementById('loginCard');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');

        // Reset Alerts
        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';

        // Set Loading State
        btnSubmit.disabled = true;
        btnSpinner.style.display = 'block';
        btnText.textContent = 'Authenticating...';

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Clear old token in localStorage just in case
                localStorage.removeItem('accessToken');
                localStorage.removeItem('refreshToken');

                successAlert.style.display = 'block';
                
                // Redirect to dashboard (home page)
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                throw new Error(data.message || 'Authentication failed');
            }
        } catch (error) {
            console.error(error);
            errorAlert.textContent = error.message || 'Connection error. Please try again.';
            errorAlert.style.display = 'block';
            
            // Reset Loading/Error State
            btnSubmit.disabled = false;
            btnSpinner.style.display = 'none';
            btnText.textContent = 'Sign In';
        }
    });
</script>

</body>
</html>
